<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Личности | Мудрость Великих</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="gradient-bg"></div>
  <div class="parallax-bg"></div>

  <nav class="nav-premium">
    <div class="nav-container">
      <div class="logo-premium">
        <i class="fas fa-crown"></i>
        <span>WISDOM</span>
      </div>
      <div class="nav-links-premium">
        <a href="index.html">Главная</a>
        <a href="celebrities.html" class="active">Личности</a>
        <a href="gallery.html">Галерея</a>
        <button id="inspireBtnPremium" class="nav-cta">Вдохновиться</button>
        <button id="favoritesBtnPremium" class="nav-icon"><i class="fas fa-heart"></i></button>
        <button id="themeTogglePremium" class="nav-icon"><i class="fas fa-moon"></i></button>
      </div>
    </div>
  </nav>

  <main class="main-premium">
    <div class="page-header-premium">
      <div class="section-header center">
        <span class="section-tag">Кто вдохновлял мир</span>
        <h1>Великие личности</h1>
        <p>Исследуйте коллекцию цитат выдающихся мыслителей, лидеров и творцов</p>
      </div>

      <div class="search-premium">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInputPremium" placeholder="Поиск по имени или цитате...">
      </div>

      <div class="filters-premium">
        <div class="filter-group">
          <span class="filter-label">Категория</span>
          <div class="filter-tags-premium" id="categoryFiltersPremium"></div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Сортировка</span>
          <select id="sortSelectPremium" class="filter-select">
            <option value="name">По имени (А-Я)</option>
            <option value="name-desc">По имени (Я-А)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="celebrities-grid-premium" id="celebritiesContainerPremium"></div>
    <div id="loadingTriggerPremium" class="loading-trigger"></div>
  </main>

  <footer class="footer-premium">
    <div class="footer-content">
      <div class="footer-brand">
        <i class="fas fa-crown"></i>
        <span>WISDOM</span>
        <p>Премиум коллекция цитат великих людей</p>
      </div>
      <div class="footer-links">
        <a href="index.html">Главная</a>
        <a href="celebrities.html">Личности</a>
        <a href="gallery.html">Галерея</a>
      </div>
      <div class="footer-social">
        <a href="#"><i class="fab fa-telegram"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-x-twitter"></i></a>
      </div>
    </div>
    <div class="footer-bottom">
      <p>© 2025 Wisdom of the Greats. All rights reserved.</p>
    </div>
  </footer>

  <div class="modal-premium" id="quoteModalPremium">
    <div class="modal-premium-content">
      <button class="modal-close">&times;</button>
      <div id="modalBodyPremium"></div>
    </div>
  </div>

  <div class="modal-premium fullscreen" id="inspireModalPremium">
    <div class="modal-premium-content fullscreen">
      <button class="modal-close">&times;</button>
      <div id="inspireModalBodyPremium"></div>
    </div>
  </div>

  <div class="toast-premium" id="toastPremium"></div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>

</html>
